name: mobile app
on:
  push:
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:
    inputs:
      server_url:
        description: "Server the app connects to by default"
        default: "https://nalut.abade.ly"

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: "3.47.7", channel: stable, cache: true}
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build APK
        run: flutter build apk --release --dart-define=SERVER_URL=${{ github.event.inputs.server_url || 'https://nalut.abade.ly' }}
      - uses: actions/upload-artifact@v4
        with:
          name: nalut-university-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
