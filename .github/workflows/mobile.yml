name: mobile app
on:
  push:
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:
    inputs:
      server_url:
        description: "Server the app connects to by default"
        default: "https://nalut.abade.ly"

jobs:
  android:
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.key.outputs.signed }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: "3.47.7", channel: stable, cache: true}
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # The release key lives in the secrets ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD. Every
      # build is signed with it, so a new version installs over the old one; the build number grows each run.
      - name: Release key
        id: key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$PASSWORD" ]; then
            echo "::warning::ANDROID_KEYSTORE_* secrets missing: signed with a throw-away key, phones cannot update over it"
            exit 0
          fi
          printf '%s' "$KEYSTORE" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "NUS_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "::add-mask::$PASSWORD"
          echo "NUS_KEYSTORE_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Build APK
        run: >-
          flutter build apk --release --build-number=$((1000 + ${{ github.run_number }}))
          --dart-define=SERVER_URL=${{ github.event.inputs.server_url || 'https://nalut.abade.ly' }}
      - name: Signing check
        continue-on-error: true
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -m2 -E "DN|SHA-256"
      - uses: actions/upload-artifact@v4
        with:
          name: nalut-university-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # Every new build of the default branch goes straight to https://<domain>/download,
  # through the same restricted deploy key (deploy/nus-update checks it is a real APK).
  publish:
    needs: android
    # only builds signed with the release key are published: any other would not install over the app
    if: >-
      github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && needs.android.outputs.signed == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with: {name: nalut-university-apk, path: apk}
      - name: Publish at /download
        env:
          KEY: ${{ secrets.DEPLOY_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          if [ -z "$KEY" ] || [ -z "$HOST" ] || [ -z "$KNOWN" ]; then
            echo "::warning::DEPLOY_* secrets missing: the app was built but not published"; exit 0
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          HOSTKEY=$(printf '%s' "$KNOWN" | tr -d '\r' | grep -oE 'ssh-ed25519 [A-Za-z0-9+/=]+' | head -1)
          HOST=$(printf '%s' "$HOST" | tr -d '[:space:]')
          PORT=$(printf '%s' "${PORT:-22}" | tr -d '[:space:]')
          if [ "$PORT" = "22" ]; then echo "$HOST $HOSTKEY" > ~/.ssh/known_hosts; else echo "[$HOST]:$PORT $HOSTKEY" > ~/.ssh/known_hosts; fi
          ssh -i ~/.ssh/deploy -p "$PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=20 \
            "nus-deploy@$HOST" "apk $GITHUB_SHA" < apk/app-release.apk
