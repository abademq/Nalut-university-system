name: deploy
# Manual "Run workflow" button: tests the selected branch, then updates the server to
# exactly that commit. Server side: deploy/setup-github-deploy.sh (restricted key).
on:
  workflow_dispatch:

concurrency: deploy

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: backend

  deploy:
    needs: tests
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Update the server
        env:
          KEY: ${{ secrets.DEPLOY_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          [ -n "$KEY" ] && [ -n "$HOST" ] && [ -n "$KNOWN" ] || { echo "::error::Add the DEPLOY_* secrets (see docs/deploy-vps.md)"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -p "${PORT:-22}" -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "nus-deploy@$HOST" "$GITHUB_SHA"
